[General]
network = Network  # trailing comment
cmdenv-status-frequency = 5s
sim-time-limit = 0.002000001s
seed-0-mt = 7
; semicolon comments abort OMNeT++ 6

**.protocol = "tcp"
**.n = ${n=4}
**.numHosts = ${numHosts=(${n}*${k}+1)*${n}*${m}}
**.router[*].queue.typename = "DropTailQueue"
**.router[0..3].ppp[*].bufferSize = 8KiB
**.logInterval = 1e-6s
**.host[*].app*-**.result-recording-modes = default,+histogram
**.enableLogging = true
**.app[0].msgSize =  ${msgSize=1MB, 2MB, 3MB}#${data}B
**.app[0].load = ${load=10..100 step 10}
**.x = ${y=1,2,3 ! load}
**.interArrival = exponential(1.5us) + uniform(0, 2ns)
**.mask = 0xff
output-scalar-file = "${resultdir}/${configname}-${runnumber}.sca"
**.long = 1 + \
    2

include ../common/links.ini

[Config fastLinks] #Note
abstract=true
extends=ethernet, wifi

[bad section]
