# Expected diagnostics are written as `# expect <severity>: <part of the message>`
# on their line. Lines without one must have no diagnostics.
#
# Passed to opp_run with -f, so its network is unknown: the submodules are
# looked up by name, and only names that no NED type declares are reported.
**.app[0].localPort = 1000
**.app[0].bandWidth = 1Gbps  # expect warning: No parameter 'bandWidth' in any NED type
