# Expected diagnostics are written as `# expect <severity>: <part of the message>`
# on their line. Lines without one must have no diagnostics.
[General]
network = Net
# beta.Net and its nested Area, not alpha.Net or alpha.Area
*.area.numAreas = 2
*.area.inner.numApps = 1
*.host.numApps = 1
*.host.radio.bandName = "5 GHz (20 MHz)"
*.host.radio.badParam = 1  # expect warning: No parameter 'badParam' in the modules matched by '*.host.radio'
*.host.queue.capacity = 3  # expect warning: Parameter 'capacity' is set in NED (Host.queue) without default()
# `**.name` may reach modules created from C++: only names no NED type declares are reported
**.autoOutputFileNames = true
**.crcMode = "computed"  # expect warning: No parameter 'crcMode' in the modules matched by '**'
**.label = ${label="A", "B"}
# Simulation libraries can register options from C++
abstrct = true  # expect warning: Unknown configuration option: abstrct

[Config UsesOther]
network = Other
# The network of the section, not the one of [General]
*.srv.radio.badParam = 1  # expect warning: No parameter 'badParam' in the modules matched by '*.srv.radio'

[Config Child]
extends = UsesOther
# The network of the section it extends
*.srv.radio.badParam = 1  # expect warning: No parameter 'badParam' in the modules matched by '*.srv.radio'
